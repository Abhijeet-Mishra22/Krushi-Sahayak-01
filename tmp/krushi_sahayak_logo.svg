<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144617" />
      <stop offset="50%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#051a07" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Subtle Circular Aura Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#FFD54F" stroke-width="4" opacity="0.25" stroke-dasharray="14 10" />

  <!-- Rising Sun of Growth -->
  <circle cx="256" cy="180" r="74" fill="url(#goldGrad)" filter="url(#shadow)" />
  <!-- Radiant Sun Rings -->
  <circle cx="256" cy="180" r="92" fill="none" stroke="#FFE082" stroke-width="3" opacity="0.35" />

  <!-- Sheltering / Helping Hands (Krushi Sahayak - The Caring Assistant) -->
  <!-- Left Supporting Leaf / Hand -->
  <path d="M 120 340 C 120 280, 180 230, 240 260 C 210 290, 190 340, 205 380 C 160 380, 120 370, 120 340 Z" 
        fill="url(#handGrad)" opacity="0.95" filter="url(#shadow)" />
  <!-- Right Supporting Leaf / Hand -->
  <path d="M 392 340 C 392 280, 332 230, 272 260 C 302 290, 322 340, 307 380 C 352 380, 392 370, 392 340 Z" 
        fill="url(#handGrad)" opacity="0.95" filter="url(#shadow)" />

  <!-- Central Sprouting Crop Seedling (The Healthy Plant) -->
  <!-- Left Sprout Leaf -->
  <path d="M 256 320 C 220 280, 160 250, 185 180 C 230 195, 250 250, 256 320 Z" 
        fill="url(#leafGrad)" filter="url(#shadow)" />
  <!-- Left Leaf Vein -->
  <path d="M 256 310 C 235 270, 215 240, 195 205" 
        stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Right Sprout Leaf -->
  <path d="M 256 320 C 292 280, 352 250, 327 180 C 282 195, 262 250, 256 320 Z" 
        fill="url(#leafGrad)" filter="url(#shadow)" />
  <!-- Right Leaf Vein -->
  <path d="M 256 310 C 277 270, 297 240, 317 205" 
        stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Central Golden Ear of Wheat / Stalk (Bountiful Harvest) -->
  <path d="M 256 390 L 256 120" stroke="#FFF9C4" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="256" cy="115" rx="14" ry="24" fill="url(#goldGrad)" filter="url(#shadow)" />
  <ellipse cx="242" cy="140" rx="12" ry="20" fill="url(#goldGrad)" transform="rotate(-25 242 140)" />
  <ellipse cx="270" cy="140" rx="12" ry="20" fill="url(#goldGrad)" transform="rotate(25 270 140)" />
  <ellipse cx="240" cy="168" rx="12" ry="20" fill="url(#goldGrad)" transform="rotate(-25 240 168)" />
  <ellipse cx="272" cy="168" rx="12" ry="20" fill="url(#goldGrad)" transform="rotate(25 272 168)" />

  <!-- Sahayak (Assistant / Doctor) Health Shield / Cross Badge on Bottom Right -->
  <g transform="translate(325, 325)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="44" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="38" fill="#1B5E20" />
    <!-- Golden Helper / Plus Cross -->
    <rect x="44" y="24" width="12" height="52" rx="4" fill="#FFD54F" />
    <rect x="24" y="44" width="52" height="12" rx="4" fill="#FFD54F" />
  </g>
</svg>
